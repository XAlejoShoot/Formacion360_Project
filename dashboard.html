<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formación360 - Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="dashboard-header">
        <h1>Formación360 Dashboard</h1>
        <a href="index.html" class="btn-logout" aria-label="Cerrar sesión">Cerrar Sesión</a>
    </header>
    <main class="dashboard-main">
        <section class="dashboard-section">
            <a href="cursos.html" class="dashboard-box" id="mis-cursos" role="button" tabindex="0">Mis Cursos</a>
            <div class="dashboard-box">Mi Progreso</div>
            <div class="dashboard-box" id="chatbot">Ayuda (Chatbot)</div>
            <div class="dashboard-box">Configuración</div>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span id="modal-close" class="modal-close">&times;</span>
        <p id="modal-message"></p>
      </div>
    </div>

    <script>
      const modal = document.getElementById('modal');
      const modalMessage = document.getElementById('modal-message');
      const modalClose = document.getElementById('modal-close');

      document.getElementById('mis-cursos').addEventListener('click', () => {
        modalMessage.textContent = 'La sección "Mis Cursos" está en construcción.';
        modal.style.display = 'block';
      });

      document.getElementById('chatbot').addEventListener('click', () => {
        modalMessage.textContent = 'El Chatbot no está disponible en esta versión.';
        modal.style.display = 'block';
      });

      modalClose.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      });
    </script>
</body>
</html>
