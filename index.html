<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formación360 - Login</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <h1 class="logo">Formación360</h1>
            <form action="dashboard.html" method="get" class="login-form">
                <label for="username" class="input-label">Usuario o Email</label>
                <input type="text" id="username" name="username" placeholder="Ingrese su usuario o email" required />
                <label for="password" class="input-label">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required />
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
        </div>
    </main>
</body>
</html>
